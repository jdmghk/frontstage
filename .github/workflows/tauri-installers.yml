# Tauri app installers, run by hand. Artifacts only: nothing is released from here.
# Untested: this workflow has never run, and the Windows build has never been compiled.
name: Tauri installers

"on":
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        default: all
        options: [all, windows, macos]

permissions:
  contents: read

env:
  # Keep in sync with the "packageManager" field in package.json.
  PNPM_VERSION: "10.33.0"
  # Tauri's DMG step skips its Finder scripting on CI.
  CI: "true"

jobs:
  macos:
    if: inputs.platform != 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            triple: x86_64-apple-darwin
          - runner: macos-14
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          brew install nasm meson ninja autoconf automake libtool pkg-config
          pnpm install --frozen-lockfile
      - name: Build the trimmed ffmpeg
        run: pnpm -F @frontstage/studio-tauri ffmpeg:build ${{ matrix.triple }}
        env:
          SOURCE_ARCHIVE: "1"
      - name: Build the DMG
        run: pnpm -F @frontstage/studio-tauri bundle --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: frontstage-${{ matrix.triple }}
          # The sources are what the GPL requires next to the download.
          path: |
            apps/studio-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            apps/studio-tauri/src-tauri/binaries/ffmpeg-sources.tar.xz

  windows:
    if: inputs.platform != 'macos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the stock ffmpeg
        run: pnpm -F @frontstage/studio-tauri ffmpeg:fetch-stock x86_64-pc-windows-msvc
      - name: Build the NSIS installer
        run: pnpm -F @frontstage/studio-tauri exec tauri build --config src-tauri/tauri.bundle.windows.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: frontstage-windows
          path: apps/studio-tauri/src-tauri/target/release/bundle/nsis/*.exe
      # Runs after the upload so a test failure still leaves the installer to look at.
      - name: Rust tests on Windows
        working-directory: apps/studio-tauri/src-tauri
        run: cargo test
